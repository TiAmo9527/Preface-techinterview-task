[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preface-interview-task"
version = "0.1.0"
description = "Room and asset data-management prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.124.4",
    "uvicorn==0.33.0",
    "pydantic==2.12.5",
    "openpyxl==3.1.5",
    "python-multipart==0.0.26",
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-playwright==0.7.1",
    "playwright==1.55.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
